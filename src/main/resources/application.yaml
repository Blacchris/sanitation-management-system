spring:
  application:
    name: sanitation-management-system

#threads:
#  virtual:
#    enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/sanitation_management_system?serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP connection pool
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
      auto_quote_keyword: true

    open-in-view: false
    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.testing.features.service: DEBUG
    org.hibernate.SQL: DEBUG

otp:
  enc-key: "9XLkzKGTD7zuk1W9fMlPgtZn1lhuaMeGCbknI2T+H/M="    # must decode to exactly 32 bytes
  hmac-key: "qQ0VDw0OTpq8eVMq8Cs5wC0lfrinl0z8I0gUGDZ1dfQ="  # must decode to at least 32 bytes

